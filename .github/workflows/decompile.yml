name: Decompile Reference APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: decompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decompile:
    name: Extract manifest, resources, and sources
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'apk-src'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APKTOOL_VERSION: "3.0.3"
      JADX_VERSION: "1.5.6"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Download reference APK from release apk-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download apk-src --pattern "target.apk" --output target.apk --clobber 2>/dev/null; then
            echo "Downloaded single target.apk asset."
          elif gh release download apk-src --pattern "*.apk" --output target.apk --clobber 2>/dev/null; then
            echo "Downloaded APK asset."
          else
            echo "Reassembling target.apk from chunked release assets..."
            mkdir -p apk_parts
            gh release download apk-src --pattern "target.apk.part*" --dir apk_parts --clobber
            cat apk_parts/target.apk.part* > target.apk
            gh release upload apk-src target.apk --clobber
            for part in apk_parts/target.apk.part*; do
              part_name=$(basename "$part")
              gh release delete-asset apk-src "$part_name" --yes || true
            done
            rm -rf apk_parts
          fi
          ls -lh target.apk

      - name: Download pinned Apktool and decode manifest and resources
        run: |
          curl -sSLo apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          java -Xmx6g -jar apktool.jar d -s -f target.apk -o out_apktool
          mkdir -p artifact_manifest_res
          cp out_apktool/AndroidManifest.xml artifact_manifest_res/AndroidManifest.xml
          cp -r out_apktool/res artifact_manifest_res/res
          if [ -f out_apktool/apktool.yml ]; then
            cp out_apktool/apktool.yml artifact_manifest_res/apktool.yml
          fi

      - name: Collect APK assets and entry listing
        run: |
          mkdir -p artifact_assets
          unzip -l target.apk > artifact_assets/apk-entries.txt
          if [ -d out_apktool/assets ]; then
            cp -r out_apktool/assets artifact_assets/assets
          fi
          if [ -d out_apktool/unknown ]; then
            cp -r out_apktool/unknown artifact_assets/unknown
          fi

      - name: Decompress Valdi UI modules
        run: |
          sudo apt-get install -y --no-install-recommends zstd binutils
          mkdir -p artifact_assets/valdi_decompressed artifact_assets/valdi_strings
          for module in out_apktool/assets/*.valdimodule; do
            name=$(basename "$module" .valdimodule)
            zstd -dc "$module" > "artifact_assets/valdi_decompressed/${name}.bin" || echo "zstd failed for $name"
            strings -n 4 "artifact_assets/valdi_decompressed/${name}.bin" > "artifact_assets/valdi_strings/${name}.txt" || true
          done
          ls artifact_assets/valdi_decompressed | head -5

      - name: Download pinned JADX and decompile sources
        run: |
          curl -sSLo jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx_bin
          chmod +x jadx_bin/bin/jadx
          export JAVA_OPTS="-Xmx10g"
          ./jadx_bin/bin/jadx --show-bad-code -j 4 -d out_jadx target.apk || true
          test -d out_jadx/sources
          if [ -d out_jadx/resources/res ]; then
            cp -rn out_jadx/resources/res/* artifact_manifest_res/res/ || true
          fi
          mkdir -p artifact_sources
          mv out_jadx/sources artifact_sources/sources
          echo "jadx=${JADX_VERSION}" > artifact_sources/jadx-version.txt

      - name: Upload manifest and resources artifact
        uses: actions/upload-artifact@v7
        with:
          name: decompiled_ref-manifest-res
          path: artifact_manifest_res/
          if-no-files-found: error
          retention-days: 30

      - name: Upload assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: decompiled_ref-assets
          path: artifact_assets/
          if-no-files-found: error
          retention-days: 30

      - name: Upload decompiled sources artifact
        uses: actions/upload-artifact@v7
        with:
          name: decompiled_ref-sources
          path: artifact_sources/
          if-no-files-found: error
          retention-days: 30
